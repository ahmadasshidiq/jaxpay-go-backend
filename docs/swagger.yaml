basePath: /api/v1
definitions:
  callbacks.SNAPResponse:
    properties:
      responseCode:
        type: string
      responseMessage:
        type: string
    type: object
  clients.CreateDTO:
    properties:
      callback_url:
        maxLength: 500
        type: string
      code:
        maxLength: 50
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      va_prefix:
        maxLength: 10
        type: string
    required:
    - callback_url
    - code
    - name
    type: object
  clients.CredentialsDTO:
    properties:
      api_key:
        type: string
      api_secret:
        type: string
      id:
        type: string
      webhook_secret:
        type: string
    type: object
  clients.UpdateDTO:
    properties:
      callback_url:
        maxLength: 500
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        type: string
      va_prefix:
        maxLength: 10
        type: string
    type: object
  helpers.PaginatedResult:
    properties:
      items: {}
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  helpers.Response:
    properties:
      data: {}
      error:
        type: string
      module:
        type: string
      success:
        type: boolean
    type: object
  models.Client:
    properties:
      api_key:
        type: string
      callback_url:
        type: string
      code:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      va_prefix:
        type: string
    type: object
  models.PaymentStatus:
    enum:
    - PENDING
    - PAID
    - EXPIRED
    - FAILED
    - CANCELLED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusPaid
    - StatusExpired
    - StatusFailed
    - StatusCancelled
  models.ProviderBank:
    properties:
      bank_code:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_va:
        type: boolean
      name:
        type: string
      product_code:
        type: string
      provider:
        type: string
      updated_at:
        type: string
    type: object
  models.ProviderRoute:
    properties:
      client_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      method:
        type: string
      provider:
        type: string
      updated_at:
        type: string
    type: object
  models.WebhookLog:
    properties:
      attempt:
        type: integer
      client_id:
        type: string
      created_at:
        type: string
      event:
        type: string
      id:
        type: string
      next_retry_at:
        type: string
      payload:
        type: object
      payment_id:
        type: string
      response_body:
        type: string
      response_code:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  payments.CreatePaymentDTO:
    properties:
      amount:
        example: 150000
        minimum: 1
        type: integer
      bank_code:
        description: wajib untuk method va
        example: "014"
        type: string
      customer_email:
        example: budi.santoso@example.com
        type: string
      customer_name:
        example: Budi Santoso
        maxLength: 255
        type: string
      customer_phone:
        example: "081234567890"
        maxLength: 17
        type: string
      description:
        example: Pembayaran invoice INV-20261106-0001
        maxLength: 500
        type: string
      expired_minutes:
        example: 60
        maximum: 10080
        minimum: 5
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      method:
        enum:
        - qris
        - va
        - direct_debit
        example: va
        type: string
      product_code:
        description: wajib untuk method direct_debit
        example: GOPAYLINK
        maxLength: 50
        type: string
      reference_id:
        example: INV-20261106-0001
        maxLength: 100
        type: string
      return_url:
        description: wajib untuk method direct_debit
        example: https://merchant.example.com/payment/return
        maxLength: 255
        type: string
    required:
    - amount
    - customer_name
    - method
    - reference_id
    type: object
  payments.PaymentResponse:
    properties:
      amount:
        type: integer
      bank_code:
        type: string
      created_at:
        type: string
      currency:
        type: string
      customer_email:
        type: string
      customer_name:
        type: string
      description:
        type: string
      expired_at:
        type: string
      id:
        type: string
      metadata:
        type: object
      method:
        type: string
      paid_at:
        type: string
      product_code:
        type: string
      provider:
        type: string
      qr_string:
        type: string
      redirect_url:
        type: string
      reference_id:
        type: string
      status:
        $ref: '#/definitions/models.PaymentStatus'
      va_number:
        type: string
    type: object
  payments.VABankResponse:
    properties:
      bank_code:
        type: string
      name:
        type: string
      product_code:
        type: string
    type: object
  providerbanks.CreateDTO:
    properties:
      bank_code:
        example: "014"
        type: string
      is_active:
        type: boolean
      is_va:
        type: boolean
      name:
        example: BCA VA Online
        maxLength: 100
        type: string
      product_code:
        example: BCAATM
        maxLength: 50
        type: string
      provider:
        example: espay
        maxLength: 50
        type: string
    required:
    - bank_code
    - name
    - product_code
    - provider
    type: object
  providerbanks.UpdateDTO:
    properties:
      bank_code:
        type: string
      is_active:
        type: boolean
      is_va:
        type: boolean
      name:
        maxLength: 100
        type: string
    type: object
  providerroutes.CreateDTO:
    properties:
      client_id:
        type: string
      is_active:
        type: boolean
      method:
        enum:
        - qris
        - va
        - direct_debit
        type: string
      provider:
        maxLength: 50
        type: string
    required:
    - client_id
    - method
    - provider
    type: object
  providerroutes.UpdateDTO:
    properties:
      is_active:
        type: boolean
      provider:
        maxLength: 50
        type: string
    type: object
info:
  contact: {}
  description: Payment gateway terpusat untuk JaxLab, JAHRIS dan Qrupi.
  title: JaxPay API
  version: "1.0"
paths:
  /callbacks/{provider}/inquiry:
    post:
      consumes:
      - application/json
      description: Provider menanyakan detail tagihan (mis. Espay service code 24).
        Signature diverifikasi oleh adapter provider; balasan mengikuti format provider.
      parameters:
      - description: Provider
        enum:
        - espay
        in: path
        name: provider
        required: true
        type: string
      - description: Timestamp ISO-8601
        in: header
        name: X-TIMESTAMP
        required: true
        type: string
      - description: SHA256withRSA signature (public key provider)
        in: header
        name: X-SIGNATURE
        required: true
        type: string
      - description: Payload provider
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callbacks.SNAPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/callbacks.SNAPResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/callbacks.SNAPResponse'
      summary: Callback inquiry dari provider
      tags:
      - Callbacks
  /callbacks/{provider}/payment:
    post:
      consumes:
      - application/json
      description: Notifikasi pembayaran / perubahan status dari provider. Signature
        diverifikasi oleh adapter provider; balasan mengikuti format provider.
      parameters:
      - description: Provider
        enum:
        - espay
        in: path
        name: provider
        required: true
        type: string
      - description: Timestamp ISO-8601
        in: header
        name: X-TIMESTAMP
        required: true
        type: string
      - description: SHA256withRSA signature (public key provider)
        in: header
        name: X-SIGNATURE
        required: true
        type: string
      - description: Payload provider
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/callbacks.SNAPResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/callbacks.SNAPResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/callbacks.SNAPResponse'
      summary: Callback payment dari provider
      tags:
      - Callbacks
  /callbacks/{provider}/settlement:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Informasi pelunasan dana ke merchant (Espay Settlement Notification).
        Body form-urlencoded, divalidasi dengan password merchant dan signature sha1(md5(rq_uuid
        + rq_datetime + sender_id + receiver_id)). Tidak mengubah status payment.
      parameters:
      - description: Provider
        enum:
        - espay
        in: path
        name: provider
        required: true
        type: string
      - description: Request ID
        in: formData
        name: rq_uuid
        required: true
        type: string
      - description: yyyy-MM-dd hh:mi:ss
        in: formData
        name: rq_datetime
        required: true
        type: string
      - description: Password merchant
        in: formData
        name: password
        required: true
        type: string
      - description: 'JSON: tx_id, payment_id, settlement_amount, settlement_date,
          settlement_remark'
        in: formData
        name: data
        required: true
        type: string
      - description: Sender ID (default GOWORLDPG)
        in: formData
        name: sender_id
        type: string
      - description: Receiver ID / comm_code (default ESPAY_MERCHANT_ID)
        in: formData
        name: receiver_id
        type: string
      - description: Hash-based signature
        in: formData
        name: signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Callback settlement dari provider
      tags:
      - Callbacks
  /clients:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Sort, mis. -created_at
        in: query
        name: sort
        type: string
      - description: Cari code / name
        in: query
        name: search
        type: string
      - description: Filter aktif
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/helpers.PaginatedResult'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/models.Client'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: List client app
      tags:
      - Clients
    post:
      consumes:
      - application/json
      description: Mengembalikan api_key, api_secret dan webhook_secret. Secret hanya
        ditampilkan sekali.
      parameters:
      - description: Client
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clients.CreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/clients.CredentialsDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Daftarkan client app
      tags:
      - Clients
  /clients/{id}:
    delete:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Hapus permanen
        in: query
        name: permanent
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Archive / hapus client app
      tags:
      - Clients
    get:
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Client'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Detail client app
      tags:
      - Clients
    patch:
      consumes:
      - application/json
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      - description: Field yang diubah
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/clients.UpdateDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.Client'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Update client app
      tags:
      - Clients
  /clients/{id}/rotate-secret:
    post:
      description: Credential lama langsung tidak berlaku.
      parameters:
      - description: Client ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/clients.CredentialsDTO'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Rotasi API key & secret
      tags:
      - Clients
  /payments:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit (maks 100)
        in: query
        name: limit
        type: integer
      - description: Sort, mis. -created_at
        in: query
        name: sort
        type: string
      - description: Status
        enum:
        - PENDING
        - PAID
        - EXPIRED
        - FAILED
        - CANCELLED
        in: query
        name: status
        type: string
      - description: Method
        enum:
        - qris
        - va
        - direct_debit
        in: query
        name: method
        type: string
      - description: Reference ID
        in: query
        name: reference_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/helpers.PaginatedResult'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/payments.PaymentResponse'
                        type: array
                    type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - ClientAPIKey: []
      summary: List transaksi milik client
      tags:
      - Payments
    post:
      consumes:
      - application/json
      description: Membuat VA / QRIS / Direct Debit. Untuk method "va", bank_code
        wajib diisi. Untuk method "direct_debit", product_code dan return_url wajib
        diisi; arahkan customer ke redirect_url pada response. Idempotent berdasarkan
        reference_id (request ulang mengembalikan payment yang sama dengan status
        200).
      parameters:
      - description: Payment
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/payments.CreatePaymentDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/payments.PaymentResponse'
              type: object
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/payments.PaymentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/helpers.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/helpers.Response'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - ClientAPIKey: []
      summary: Buat transaksi pembayaran
      tags:
      - Payments
  /payments/{id}:
    get:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/payments.PaymentResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - ClientAPIKey: []
      summary: Detail + status transaksi
      tags:
      - Payments
  /payments/{id}/cancel:
    post:
      description: Hanya untuk payment PENDING. Membatalkan QR di provider / menutup
        VA.
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/payments.PaymentResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - ClientAPIKey: []
      summary: Batalkan transaksi
      tags:
      - Payments
  /payments/{id}/check-status:
    post:
      parameters:
      - description: Payment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/payments.PaymentResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - ClientAPIKey: []
      summary: Paksa cek status ke provider
      tags:
      - Payments
  /payments/va-banks:
    get:
      description: Bank VA yang didukung provider route VA aktif milik client. Gunakan
        bank_code saat membuat payment method "va".
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/payments.VABankResponse'
                  type: array
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - ClientAPIKey: []
      summary: Daftar bank Virtual Account
      tags:
      - Payments
  /provider-banks:
    get:
      parameters:
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Sort
        in: query
        name: sort
        type: string
      - description: Provider, mis. espay
        in: query
        name: provider
        type: string
      - description: Kode bank
        in: query
        name: bank_code
        type: string
      - description: Hanya produk VA
        in: query
        name: is_va
        type: boolean
      - description: Status aktif
        in: query
        name: is_active
        type: boolean
      - description: Cari nama
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/helpers.PaginatedResult'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/models.ProviderBank'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: List master bank / produk provider
      tags:
      - Provider Banks
    post:
      consumes:
      - application/json
      parameters:
      - description: Bank
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/providerbanks.CreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/helpers.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Tambah master bank
      tags:
      - Provider Banks
  /provider-banks/{id}:
    delete:
      parameters:
      - description: Bank ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Hapus master bank
      tags:
      - Provider Banks
    get:
      parameters:
      - description: Bank ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/models.ProviderBank'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
